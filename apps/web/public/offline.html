<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <title>Çevrimdışı — Kepenk.ai</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0f172a;
            color: #e2e8f0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        .container {
            text-align: center;
            padding: 2rem;
            max-width: 420px;
        }
        .icon {
            width: 80px; height: 80px;
            background: rgba(249, 115, 22, 0.1);
            border: 1px solid rgba(249, 115, 22, 0.2);
            border-radius: 1.25rem;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 1.5rem;
            font-size: 2rem;
        }
        h1 {
            font-size: 1.5rem; font-weight: 700;
            margin-bottom: 0.5rem;
            color: #f1f5f9;
        }
        p {
            color: #94a3b8; font-size: 0.875rem;
            line-height: 1.6; margin-bottom: 1.5rem;
        }
        .retry {
            display: inline-flex; align-items: center; gap: 0.5rem;
            background: rgba(249, 115, 22, 0.15);
            border: 1px solid rgba(249, 115, 22, 0.3);
            color: #fb923c;
            padding: 0.625rem 1.5rem;
            border-radius: 0.75rem;
            font-size: 0.875rem; font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
        }
        .retry:hover {
            background: rgba(249, 115, 22, 0.25);
        }
        .pulse {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: #f97316;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.3); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">📡</div>
        <h1>Bağlantı Kesildi</h1>
        <p>İnternet bağlantınız şu an aktif değil. Endişelenmeyin — bağlantınız geri geldiğinde Kepenk.ai otomatik olarak yeniden bağlanacak.</p>
        <a href="/" class="retry" onclick="location.reload(); return false;">
            <span class="pulse"></span>
            Tekrar Dene
        </a>
    </div>
</body>
</html>
