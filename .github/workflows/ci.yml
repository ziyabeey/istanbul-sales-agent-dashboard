# CI/CD Pipeline — kepenk.ai
name: CI/CD Pipeline

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

env:
  GCP_PROJECT: kepenk-ai
  GCP_REGION: europe-west1

jobs:
  lint-and-type:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.1.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --if-present lint
      - run: pnpm -r --if-present typecheck

  unit-tests:
    runs-on: ubuntu-latest
    needs: lint-and-type
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.1.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @kepenk/web test:unit
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        continue-on-error: true

  integration-tests:
    runs-on: ubuntu-latest
    needs: lint-and-type
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.1.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @kepenk/web test:integration

  bundle-size:
    runs-on: ubuntu-latest
    needs: lint-and-type
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.1.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  e2e-tests:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.1.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @kepenk/web exec playwright install --with-deps
      - run: pnpm --filter @kepenk/web test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/test-results/e2e-html/

  lighthouse:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: e2e-tests
    steps:
      - uses: actions/checkout@v4
      - uses: treosh/lighthouse-ci-action@v11
        with:
          configPath: ./lighthouserc.json

  deploy-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [e2e-tests, lighthouse]
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Deploy to staging (canary)
        run: |
          gcloud run deploy kepenk-api-staging \
            --image=gcr.io/$GCP_PROJECT/kepenk-api:${{ github.sha }} \
            --region=$GCP_REGION \
            --no-traffic \
            --tag=canary
