<!-- ═══════════════════════════════════════════════════════════
     GOOGLE MAPS EMBED — HTML Gömme Widget
     Wix: ⊕ Ekle > Gömülü Kod > HTML Gömme
     Boyut: %100 genişlik x 400px yükseklik
     İletişim sayfasına yerleştir
     Widget ID: #htmlMap
     ═══════════════════════════════════════════════════════════ -->
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #f5f3ee;
    font-family: 'Inter', system-ui, sans-serif;
    height: 100vh;
    overflow: hidden;
  }

  .map-container {
    width: 100%;
    height: 100%;
    position: relative;
    border-radius: 20px;
    overflow: hidden;
  }

  .map-container iframe {
    width: 100%;
    height: 100%;
    border: none;
    filter: saturate(0.9) contrast(1.05);
  }

  /* Harita üstü bilgi kartı */
  .map-card {
    position: absolute;
    bottom: 24px;
    left: 24px;
    background: rgba(255,255,255,0.95);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 16px;
    padding: 20px 24px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.12);
    max-width: 280px;
    z-index: 10;
    border: 1px solid rgba(0,0,0,0.06);
  }

  .map-card-title {
    font-weight: 800;
    font-size: 15px;
    color: #1a1a1a;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .map-card-title::before {
    content: '📍';
    font-size: 16px;
  }

  .map-card-addr {
    font-size: 13px;
    color: #666;
    line-height: 1.5;
    margin-bottom: 12px;
  }

  .map-card-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #F5C518;
    color: #1a1a1a;
    border: none;
    padding: 10px 18px;
    border-radius: 10px;
    font-weight: 700;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
    text-decoration: none;
  }

  .map-card-btn:hover {
    background: #1a1a1a;
    color: #F5C518;
    transform: translateY(-1px);
  }

  /* Koyu mod desteği */
  @media (prefers-color-scheme: dark) {
    body { background: #1a1a1a; }
    .map-container iframe { filter: invert(0.9) hue-rotate(180deg) saturate(0.3); }
    .map-card { background: rgba(30,30,30,0.95); border-color: rgba(255,255,255,0.08); }
    .map-card-title { color: #f5f5f5; }
    .map-card-addr { color: #999; }
  }
</style>
</head>
<body>
  <div class="map-container">
    <!-- Google Maps Embed — koordinatları JS ile güncellenebilir -->
    <iframe id="mapFrame"
      src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d48172.48877830384!2d28.93!3d41.01!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x14caa7040068086b%3A0xe1cdecaa64520e28!2sIstanbul!5e0!3m2!1str!2str!4v1699000000000"
      loading="lazy"
      referrerpolicy="no-referrer-when-downgrade"
      allowfullscreen>
    </iframe>

    <!-- Bilgi Kartı -->
    <div class="map-card">
      <div class="map-card-title" id="cardTitle">Ionica Dry Merkez</div>
      <div class="map-card-addr" id="cardAddr">
        Levent Mahallesi, Büyükdere Cad.<br>
        No: 123, Beşiktaş / İstanbul
      </div>
      <a class="map-card-btn" id="directionsBtn" 
         href="https://maps.google.com/?q=41.01,28.93" 
         target="_blank" rel="noopener">
        🗺 Yol Tarifi Al
      </a>
    </div>
  </div>

  <script>
    // Wix Velo'dan konum bilgisi al
    window.addEventListener('message', (event) => {
      const data = event.data;
      if (!data || !data.type) return;

      if (data.type === 'setLocation') {
        const { lat, lng, zoom, title, address } = data;

        // Harita iframe'ini güncelle
        const mapFrame = document.getElementById('mapFrame');
        if (mapFrame && lat && lng) {
          mapFrame.src = `https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d${zoom ? 50000 / zoom : 3000}!2d${lng}!3d${lat}!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zM${Math.abs(lat)}!5e0!3m2!1str!2str`;
        }

        // Kart bilgilerini güncelle
        if (title) {
          document.getElementById('cardTitle').textContent = title;
        }
        if (address) {
          document.getElementById('cardAddr').innerHTML = address;
        }

        // Yol tarifi linkini güncelle
        const btn = document.getElementById('directionsBtn');
        if (btn && lat && lng) {
          btn.href = `https://maps.google.com/?q=${lat},${lng}`;
        }
      }
    });
  </script>
</body>
</html>
