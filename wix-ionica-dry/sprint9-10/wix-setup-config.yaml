#──────────────────────────────────────────────────────────
# D. RENK & FONT TEMASI
#──────────────────────────────────────────────────────────
# Wix Editör > Site Tasarımı > Renk Teması

PRIMARY_COLORS:
  sarı:     "#F5C518"  # Ana vurgu rengi (CTA, badge)
  pembe:    "#FFB6C1"  # İkincil vurgu (kadınsı ürünler)
  yeşil:    "#4A6741"  # Doğa / güven rengi
  koyu:     "#1A1A1A"  # Metin, koyu arka plan
  açık:     "#F8F6F2"  # Sayfa arka planı (krem beyaz)
  beyaz:    "#FFFFFF"  # Kart arka planı

FONT_THEME:
  başlıklar: "Playfair Display"    # Serif — premium his
  alt_başlık: "Inter"              # Sans-serif — modern temiz
  body:      "Inter"               # Sans-serif — okunabilirlik
  nav:       "Inter Medium"        # Navigasyon
  büyük_sayı: "DM Serif Display"   # İstatistik sayıları

# Google Fonts URL:
# https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Inter:wght@300;400;500;600;700&family=DM+Serif+Display&display=swap


#──────────────────────────────────────────────────────────
# E. PERFORMANS KONTROL LİSTESİ
#──────────────────────────────────────────────────────────

GOREVLER:
  - [x] Görseller WebP — Wix otomatik dönüştürür, yükleme sırasında optimize et
  - [ ] Ayarlar > Görüntü Keskinleştirici aktif et
  - [ ] Anti-gravity HTML: will-change kullanıldı ✓
  - [ ] Anti-gravity HTML: IntersectionObserver ile viewport dışında pause ✓
  - [ ] Lazy loading — Wix varsayılan olarak yapar ✓
  - [ ] CSS prefers-reduced-motion — eklendi ✓
  - [ ] Mobilde parçacık sayısı azaltıldı (12→6) ✓
  - [ ] Header scroll: debounce ekle (performans)
  - [ ] Font preconnect — Wix otomatik yapar


#──────────────────────────────────────────────────────────
# F. ERİŞİLEBİLİRLİK
#──────────────────────────────────────────────────────────
# Wix Ayarlar > Erişilebilirlik Sihirbazı

GOREVLER:
  - [ ] Tüm görsellere alt text ekle
  - [ ] Renk kontrastı minimum 4.5:1 (AA seviye)
  - [ ] Klavye navigasyonu test et (Tab, Enter, Escape)
  - [ ] ARIA etiketleri — Wix otomatik ekler, özel widget'lar için ekle
  - [ ] Focus visible stilleri — HTML embed'lerde :focus outline ekle


#──────────────────────────────────────────────────────────
# G. GİZLİLİK & ÇEREZLER
#──────────────────────────────────────────────────────────
# Wix Ayarlar > Gizlilik ve Çerezler

GOREVLER:
  - [ ] KVKK/GDPR çerez banner'ı aktif et
  - [ ] Gizlilik Politikası sayfası oluştur ve footer'a bağla
  - [ ] Kullanım Şartları sayfası oluştur
  - [ ] Mesafeli Satış Sözleşmesi (e-ticaret zorunlu)


