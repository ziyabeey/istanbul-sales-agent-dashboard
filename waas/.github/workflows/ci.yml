name: Waas CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Install dependencies
      working-directory: ./waas/backend
      run: npm ci
    - name: Generate Prisma Client
      working-directory: ./waas/backend
      run: npx prisma generate
    - name: Build
      working-directory: ./waas/backend
      run: npm run build
    # - name: Test
    #   working-directory: ./waas/backend
    #   run: npm run test

  frontend-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Install dependencies
      working-directory: ./waas/frontend
      run: npm ci
    - name: Build
      working-directory: ./waas/frontend
      run: npm run build
    - name: Install Playwright Browsers
      working-directory: ./waas/frontend
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      working-directory: ./waas/frontend
      run: npx playwright test

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    steps:
    - uses: actions/checkout@v4
    - name: Build Docker images
      run: |
        docker compose -f waas/docker-compose.yml build
