version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: waas_postgres
    restart: always
    environment:
      POSTGRES_USER: ${Item:DB_USER:-admin}
      POSTGRES_PASSWORD: ${Item:DB_PASSWORD:-password}
      POSTGRES_DB: ${Item:DB_NAME:-waas_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongodb:
    image: mongo:6.0
    container_name: waas_mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${Item:MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${Item:MONGO_PASSWORD:-password}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: waas_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  mongo_data:
  redis_data:
