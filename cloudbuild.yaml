# Canonical staging build/deploy contract.
# Hosted inventory receipt: 2026-09-26.
# This file is intentionally fail-closed to the nonprod project and never promotes traffic.
substitutions:
  _REGION: europe-west3
  _REPOSITORY: kepenk
  _IMAGE: kepenk-web
  _SERVICE: kepenk-web-staging
  _IMAGE_TAG: manual

steps:
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'assert-nonprod-target'
    entrypoint: 'bash'
    args:
      - '-ceu'
      - |
        test "$PROJECT_ID" = "cs-project-ljhot8la" || {
          echo "Refusing build: expected nonprod project cs-project-ljhot8la, got $PROJECT_ID" >&2
          exit 1
        }
        test "${_REGION}" = "europe-west3"
        test "${_SERVICE}" = "kepenk-web-staging"

  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-image'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:${_IMAGE_TAG}'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-image'
    args:
      - 'push'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:${_IMAGE_TAG}'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-private-no-traffic-canary'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE}'
      - '--image'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:${_IMAGE_TAG}'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--service-account'
      - 'kepenk-web-runtime@$PROJECT_ID.iam.gserviceaccount.com'
      - '--no-traffic'
      - '--tag'
      - 'canary'
      - '--quiet'

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:${_IMAGE_TAG}'

options:
  logging: CLOUD_LOGGING_ONLY
